# Cloudflare Workers configuration
# https://developers.cloudflare.com/workers/wrangler/configuration/

name = "addd"
main = "dist-worker/worker.js"
compatibility_date = "2024-09-23"

# Enable Node.js compatibility shims (needed for crypto, Buffer, jimp, jsqr).
compatibility_flags = ["nodejs_compat"]

# ── Local development ────────────────────────────────────────────────────────
[dev]
port = 8787

# ── Environment variables ─────────────────────────────────────────────────────
# Uncomment and set values for the environment you want to target.
# Secrets (like API_KEY, JWT_SECRET) should be set via `wrangler secret put`
# rather than committed here.
[vars]
API_PREFIX = "/api/v1"
# API_KEY = ""      # set via: wrangler secret put API_KEY
# JWT_SECRET = ""   # set via: wrangler secret put JWT_SECRET

# ── Demo environment (for testing / demos) ────────────────────────────────────
# Deploy: npm run deploy:demo
# Secrets: wrangler secret put JWT_SECRET --env demo
[env.demo]
name = "addd-demo"
vars = { API_PREFIX = "/api/v1" }

# ── Staging environment ───────────────────────────────────────────────────────
[env.staging]
name = "addd-staging"
vars = { API_PREFIX = "/api/v1" }

# ── Production environment ───────────────────────────────────────────────────
[env.production]
name = "addd-production"
vars = { API_PREFIX = "/api/v1" }
